{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container">
    <h2 style="text-align: center; margin-bottom: 20px;">Create Account</h2>
    
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Choose a username" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Create a strong password" class="form-control">
            <small style="color: #666; display: block; margin-top: 5px; font-size: 13px;">
                Must be at least 12 characters with uppercase, lowercase, number, and special character
            </small>
        </div>
        
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password" class="form-control">
        </div>
        
        <button type="submit" class="btn btn-success btn-block">Create Account</button>
    </form>
    
    <div style="text-align: center; margin: 25px 0;">
        <hr style="border: none; border-top: 1px solid #ddd; margin: 0;">
        <span style="background: white; padding: 0 15px; color: #999; position: relative; top: -12px;">OR</span>
    </div>
    
    <div style="text-align: center;">
        <a href="{{ url_for('google_login') }}" class="google-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 12px; background: #db4437; color: white; padding: 12px 40px; text-decoration: none; border-radius: 4px; font-size: 16px; font-weight: 500; transition: background 0.3s; width: 100%; max-width: 320px; border: none; cursor: pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" style="fill: white; flex-shrink: 0;">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign up with Google
        </a>
        <style>
            .google-btn:hover {
                background: #c5392e !important;
                transform: scale(1.02);
                transition: all 0.3s ease;
            }
            .google-btn:active {
                transform: scale(0.98);
            }
        </style>
    </div>
    
    <div class="text-center" style="margin-top: 20px;">
        Already have an account? <a href="{{ url_for('login') }}" style="color: #4a90d9; text-decoration: none; font-weight: 500;">Sign In</a>
    </div>
</div>

<!-- Same styles as login.html -->
<style>
    .container {
        max-width: 420px;
        margin: 0 auto;
        background: white;
        padding: 30px 30px 40px;
        border-radius: 12px;
        box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }
    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e1e5e9;
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.3s ease;
        background: #fafbfc;
        box-sizing: border-box;
    }
    .form-control:focus {
        border-color: #4a90d9;
        outline: none;
        background: white;
        box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.1);
    }
    .form-group {
        margin-bottom: 18px;
    }
    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #2d3748;
        font-size: 14px;
    }
    .btn-block {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .btn-success {
        background: #2ecc71;
        color: white;
    }
    .btn-success:hover {
        background: #27ae60;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
    }
    h2 {
        color: #1a1a2e;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 25px;
        letter-spacing: -0.5px;
    }
</style>
{% endblock %}
